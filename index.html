
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>CmAl AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #171717;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eeeeee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #777;
    }

    .new-chat {
      border: 1px solid #e5e5e5;
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #welcome {
      margin: auto;
      text-align: center;
      max-width: 300px;
    }

    #welcome h1 {
      font-size: 36px;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    #welcome p {
      color: #888;
      font-size: 15px;
    }

    .message {
      max-width: 88%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #171717;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot {
      align-self: flex-start;
      background: #f3f3f3;
      color: #171717;
      border-bottom-left-radius: 5px;
    }

    footer {
      padding: 12px 14px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid #eeeeee;
      background: white;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 7px 8px 7px 15px;
    }

    #msg {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      min-width: 0;
      background: transparent;
    }

    #send {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: #171717;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .status {
      text-align: center;
      color: #999;
      font-size: 11px;
      padding-top: 9px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">CmAl<span> AI</span></div>
  <button class="new-chat" onclick="newChat()">+ Yeni sohbet</button>
</header>

<main id="chat">
  <div id="welcome">
    <h1>Merhaba.</h1>
    <p>Ben CmAl. Bugün sana nasıl yardımcı olabilirim?</p>
  </div>
</main>

<footer>
  <div class="input-area">
    <input id="msg" type="text"
      placeholder="CmAl'a mesaj gönder..."
      autocomplete="off">
    <button id="send" onclick="sendMessage()">↑</button>
  </div>
  <div class="status">CmAl AI · Yapay zekâ asistanı</div>
</footer>

<script src="https://js.puter.com/v2/"></script>
<script src="./script.js"></script>

</body>
</html>
