
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>CmAl</title>
<link rel="manifest" href="manifest.json">
<style>
* {
    box-sizing: border-box;
    margin: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: #fff;
    color: #171717;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    height: 72px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
}

.logo {
    font-size: 30px;
    font-weight: 850;
    letter-spacing: -2px;
}

.logo span {
    color: #777;
}

.new-chat {
    background: #f5f5f5;
    border: 1px solid #ededed;
    padding: 10px 15px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
}

/* CHAT */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.welcome {
    margin: auto;
    width: 100%;
    max-width: 450px;
    text-align: center;
}

.symbol {
    width: 65px;
    height: 65px;
    border-radius: 22px;
    margin: 0 auto 25px;
    background: linear-gradient(135deg,#171717,#555);
    display: grid;
    place-items: center;
    color: white;
    font-size: 32px;
    font-weight: 800;
    box-shadow: 0 10px 30px #00000018;
}

.welcome h1 {
    font-size: 34px;
    letter-spacing: -1.7px;
    margin-bottom: 12px;
    font-weight: 750;
}

.welcome p {
    font-size: 15px;
    color: #888;
    line-height: 1.6;
}

.suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 32px;
}

.suggestion {
    border: 1px solid #eeeeee;
    background: #fff;
    border-radius: 17px;
    padding: 15px 12px;
    text-align: left;
    font-size: 13px;
    color: #555;
    box-shadow: 0 3px 12px #00000005;
}

/* MESSAGES */

.message {
    max-width: 86%;
    padding: 14px 17px;
    border-radius: 19px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #202020;
    color: white;
    border-bottom-right-radius: 5px;
}

.bot {
    align-self: flex-start;
    background: #f5f5f5;
    color: #222;
    border-bottom-left-radius: 5px;
}

/* INPUT */

footer {
    padding: 12px 15px 22px;
    background: white;
}

.input-box {
    max-width: 650px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px 9px 19px;
    border: 1px solid #e8e8e8;
    border-radius: 23px;
    box-shadow: 0 5px 25px #0000000a;
}

input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 15px;
    background: transparent;
    color: #222;
}

input::placeholder {
    color: #aaa;
}

.send {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 15px;
    background: #171717;
    color: white;
    font-size: 23px;
}

.note {
    text-align: center;
    color: #aaa;
    font-size: 10px;
    margin-top: 12px;
}

button {
    cursor: pointer;
}

</style>
</head>

<body>

<header>
    <div class="logo">CmAl<span>.</span></div>
    <button class="new-chat" onclick="newChat()">
        + Yeni sohbet
    </button>
</header>

<main id="chat">

    <section class="welcome" id="welcome">

        <div class="symbol">C</div>

        <h1>Nasıl yardımcı olabilirim?</h1>

        <p>
            Merhaba! Ben CmAl.
            Birlikte düşünelim, keşfedelim ve üretelim.
        </p>

        <div class="suggestions">

            <button class="suggestion"
            onclick="ask('Bana bir fikir ver')">
                ✦ Bana bir fikir ver
            </button>

            <button class="suggestion"
            onclick="ask('Kodlama öğrenmek istiyorum')">
                ◈ Kodlama öğren
            </button>

            <button class="suggestion"
            onclick="ask('Bir hikaye anlat')">
                ✧ Bir hikâye anlat
            </button>

            <button class="suggestion"
            onclick="ask('Bilim hakkında konuşalım')">
                ◎ Bilimi keşfet
            </button>

        </div>
    </section>

</main>

<footer>

    <div class="input-box">

        <input
            id="msg"
            placeholder="CmAl'a mesajını yaz..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button class="send" onclick="sendMessage()">
            ↑
        </button>

    </div>

    <div class="note">
        CmAl · Yapay zekâ asistanın
    </div>

</footer>

<script>

function ask(text) {
    document.getElementById("msg").value = text;
    sendMessage();
}

function sendMessage() {

    let input = document.getElementById("msg");
    let text = input.value.trim();

    if (!text) return;

    let welcome = document.getElementById("welcome");

    if (welcome) welcome.remove();

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {
        addMessage(
            "Mesajını aldım! Gerçek yapay zekâ bağlantısı henüz kurulmadı.",
            "bot"
        );
    }, 500);
}

function addMessage(text, type) {

    let chat = document.getElementById("chat");
    let div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function newChat() {
    document.getElementById("chat").innerHTML = `
        <section class="welcome" id="welcome">
            <div class="symbol">C</div>
            <h1>Nasıl yardımcı olabilirim?</h1>
            <p>Merhaba! Ben CmAl. Birlikte düşünelim, keşfedelim ve üretelim.</p>
        </section>
    `;
}

</script>

</body>
</html>
