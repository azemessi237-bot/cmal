
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">

    <title>CmAl</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">

</head>
<body>

<header>
    <div class="logo">CmAl<span>.</span></div>

    <button class="new-chat" onclick="newChat()">
        + Yeni sohbet
    </button>
</header>

<main id="chat">

    <section class="welcome" id="welcome">

        <div class="symbol">C</div>

        <h1>Nasıl yardımcı olabilirim?</h1>

        <p>
            Merhaba! Ben CmAl.
            Birlikte düşünelim, keşfedelim ve üretelim.
        </p>

        <div class="suggestions">

            <button class="suggestion"
                onclick="ask('Bana bir fikir ver')">
                ✦ Bana bir fikir ver
            </button>

            <button class="suggestion"
                onclick="ask('Kodlama öğrenmek istiyorum')">
                ◈ Kodlama öğren
            </button>

            <button class="suggestion"
                onclick="ask('Bir hikaye anlat')">
                ✧ Bir hikâye anlat
            </button>

            <button class="suggestion"
                onclick="ask('Bilim hakkında konuşalım')">
                ◎ Bilimi keşfet
            </button>

        </div>

    </section>

</main>

<footer>

    <div class="input-box">

        <input
            id="msg"
            type="text"
            placeholder="CmAl'a mesajını yaz..."
            autocomplete="off"
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button class="send" onclick="sendMessage()">
            ↑
        </button>

    </div>

    <div class="note">
        CmAl · Yapay zekâ asistanın
    </div>

</footer>

<script src="./script.js"></script>

</body>
</html>
